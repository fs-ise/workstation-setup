---
- name: Install required baseline packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop: "{{ baseline_required_packages }}"

- name: Remove unwanted packages (best effort)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: absent
  loop: "{{ baseline_remove_packages_best_effort }}"
  failed_when: false

- name: Install optional baseline packages (best effort)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ baseline_optional_packages }}"
  failed_when: false

- name: Ensure Flathub remote exists
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
  when: baseline_configure_flathub | bool
