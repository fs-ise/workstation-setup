---
baseline_required_packages:
  - ca-certificates
  - curl
  - dnf-plugins-core
  - git
  - python3
  - python3-pip
  - tar
  - unzip
  - wget

baseline_optional_packages:
  - catdoc
  - clamav
  - clamav-freshclam
  - dictd
  - diffpdf
  - gnupg2
  - jdupes
  - libxslt
  - openssh-clients
  - openssh-server
  - pandoc-cli
  - pinentry
  - poppler-utils
  - pwgen
  - ruby
  - rubygem-bundler
  - tldr
  - unifont-fonts
  - unrtf
  - uv
  - vim
  - wv

# DNF packages owned by this role; consumed by the package audit.
baseline_managed_dnf_packages: "{{ baseline_required_packages + baseline_optional_packages }}"
