---
baseline_required_packages:
  - ca-certificates
  - curl
  - dnf-plugins-core
  - git
  - python3
  - python3-pip
  - tar
  - unzip
  - wget

baseline_remove_packages_best_effort:
  - aisleriot
  - brasero
  - cheese
  - deja-dup
  - evolution
  - evince
  - gnome-boxes
  - gnome-calendar
  - gnome-characters
  - gnome-connections
  - gnome-contacts
  - gnome-font-viewer
  - gnome-mahjongg
  - gnome-maps
  - gnome-mines
  - gnome-sudoku
  # Ptyxis replaced GNOME Terminal in the managed desktop configuration.
  - gnome-terminal
  - gnome-todo
  - gnome-tour
  - gnome-weather
  - ibus-m17n
  - ibus-typing-booster
  # The workstation uses libxslt at runtime; development headers are not required.
  - libxslt-devel
  - malcontent
  - malcontent-control
  - mediawriter
  - nautilus-share
  - orca
  - shotwell
  - simple-scan
  - telnet
  - transmission
  - vino
  - yelp

baseline_optional_packages:
  - audacity
  - autokey-gtk
  - catdoc
  - clamav
  - clamav-update
  - dictd
  - diffpdf
  - flatpak
  - gimp
  - gnome-clocks
  - gnome-commander
  - gnupg2
  - hplip
  - hplip-gui
  - jdupes
  - libxslt
  - nextcloud-client
  - obs-studio
  - openssh-clients
  - openssh-server
  - pdfarranger
  - okular
  - pinentry
  - poppler-utils
  - pwgen
  - python3-tkinter
  - recoll
  - ruby
  - rubygem-bundler
  - sqlitebrowser
  - tldr
  - unifont-fonts
  - unrtf
  - vim
  - wv
  - xclip
  - xdotool
  - xournalpp
  - xsel
  - ydotool

# These switches preserve workstation behavior while allowing the role's safe
# configuration tasks to be exercised in a disposable CI container.
baseline_configure_flathub: true

# DNF packages owned by this role; consumed by the package audit.
baseline_managed_dnf_packages: "{{ baseline_required_packages + baseline_optional_packages }}"
