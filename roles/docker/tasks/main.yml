---
- name: Remove podman-docker (conflicts with Docker CE CLI)
  ansible.builtin.dnf:
    name: podman-docker
    state: absent
  failed_when: false

- name: Import the Docker RPM signing key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ docker_rpm_signing_key_url }}"
    fingerprint:
      - "{{ docker_rpm_signing_key_fingerprint }}"
    validate_certs: true

- name: Configure the official Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    file: docker-ce
    description: Docker CE Stable - $basearch
    baseurl: "{{ docker_repository_baseurl }}"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: false
    gpgkey: "{{ docker_rpm_signing_key_url }}"
    sslverify: true

- name: Install Python deps for Ansible (requests + packaging + docker)
  ansible.builtin.dnf:
    name: "{{ docker_python_packages }}"
    state: present

- name: Install Docker Engine packages
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    disable_gpg_check: false

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add invoking user to docker group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: true
