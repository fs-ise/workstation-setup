---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_python_packages:
  - python3-requests
  - python3-packaging
  - python3-docker

# DNF packages owned by this role; consumed by the package audit.
docker_managed_dnf_packages: "{{ docker_packages + docker_python_packages }}"
