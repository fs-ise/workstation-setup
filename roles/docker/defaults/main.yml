---
# Docker's Fedora repository signing key. The fingerprint is pinned so
# ansible.builtin.rpm_key rejects an unexpected key returned by the URL.
docker_rpm_signing_key_url: https://download.docker.com/linux/fedora/gpg
docker_rpm_signing_key_fingerprint: >-
  060A61C51B558A7F742B77AAC52FEB6B621E9F35
docker_repository_baseurl: >-
  https://download.docker.com/linux/fedora/$releasever/$basearch/stable

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_python_packages:
  - python3-requests
  - python3-packaging
  - python3-docker

# DNF packages owned by this role; consumed by the package audit.
docker_managed_dnf_packages: "{{ docker_packages + docker_python_packages }}"
