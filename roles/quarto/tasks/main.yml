---
- name: Check installation path {{ quarto_install_dir }}
  ansible.builtin.stat:
    path: "{{ quarto_install_dir }}"
  register: quarto_path_stat

- name: Remove installation path if it is a directory {{ quarto_install_dir }}
  ansible.builtin.file:
    path: "{{ quarto_install_dir }}"
    state: absent
  when: quarto_path_stat.stat.exists and quarto_path_stat.stat.isdir
  register: quarto_remove_result

- name: Install Quarto archive
  when: not quarto_path_stat.stat.exists or quarto_remove_result.changed
  block:
    - name: Download Quarto tarball
      ansible.builtin.get_url:
        url: "{{ quarto_url }}"
        dest: "/tmp/{{ quarto_tarball }}"
        mode: "0644"

    - name: Unpack Quarto tarball to versioned installation directory
      ansible.builtin.unarchive:
        src: "/tmp/{{ quarto_tarball }}"
        dest: /opt
        remote_src: true

- name: Symlink the versioned directory to the installation path {{ quarto_install_dir }}
  ansible.builtin.file:
    src: "{{ quarto_install_dir }}-{{ quarto_version }}"
    dest: "{{ quarto_install_dir }}"
    state: link
    force: true
    follow: false

- name: Add Quarto bin directory to system PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/quarto.sh
    mode: "0644"
    content: |
      export PATH={{ quarto_install_dir }}/bin:$PATH
