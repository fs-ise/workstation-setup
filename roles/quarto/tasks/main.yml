---
- name: Require a pinned SHA256 checksum for the Quarto RPM
  ansible.builtin.assert:
    that:
      - quarto_rpm_checksum is string
      - quarto_rpm_checksum is match('^sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      Set quarto_rpm_checksum to the independently verified SHA256 digest for
      {{ quarto_rpm }} in the form sha256:<digest>; refusing an unchecked RPM.

- name: Inspect the legacy Quarto installation symlink
  ansible.builtin.stat:
    path: /opt/quarto
    follow: false
  register: quarto_legacy_link

- name: Remove the legacy Quarto installation symlink
  ansible.builtin.file:
    path: /opt/quarto
    state: absent
  when:
    - quarto_legacy_link.stat.islnk | default(false)
    - quarto_legacy_link.stat.lnk_source == '/opt/quarto-1.6.42'

- name: Remove the legacy Quarto 1.6.42 installation
  ansible.builtin.file:
    path: /opt/quarto-1.6.42
    state: absent

- name: Remove the legacy Quarto PATH configuration
  ansible.builtin.file:
    path: /etc/profile.d/quarto.sh
    state: absent

- name: Download the Quarto RPM
  ansible.builtin.get_url:
    url: "{{ quarto_url }}"
    dest: "{{ quarto_rpm_path }}"
    checksum: "{{ quarto_rpm_checksum }}"
    mode: "0644"

- name: Install the Quarto RPM
  ansible.builtin.dnf:
    name: "{{ quarto_rpm_path }}"
    state: present
    # Fedora/DNF cannot validate this upstream RPM with a suitable signing key.
    # The verified, pinned SHA256 release-asset digest is the integrity control.
    disable_gpg_check: true
