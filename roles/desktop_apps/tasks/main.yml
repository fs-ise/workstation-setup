---
- name: Remove unwanted workstation packages
  ansible.builtin.dnf:
    name: "{{ desktop_apps_remove_packages }}"
    state: absent

- name: Install desktop applications
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ desktop_apps_packages }}"

- name: Ensure Flathub remote exists
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
  when: desktop_apps_configure_flathub | bool
