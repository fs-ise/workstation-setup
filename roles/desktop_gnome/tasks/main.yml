---
- name: Read WIFIonICE cloned MAC address setting
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - 802-11-wireless.cloned-mac-address
      - connection
      - show
      - WIFIonICE
  register: desktop_gnome_wifionice_cloned_mac
  changed_when: false
  failed_when: false
  when: desktop_gnome_configure_wifionice_permanent_mac | bool

- name: Configure WIFIonICE to use the permanent MAC address
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - WIFIonICE
      - 802-11-wireless.cloned-mac-address
      - permanent
  when:
    - desktop_gnome_configure_wifionice_permanent_mac | bool
    - desktop_gnome_wifionice_cloned_mac.rc == 0
    - desktop_gnome_wifionice_cloned_mac.stdout | trim != "permanent"

- name: Install Obsidian via Flatpak
  community.general.flatpak:
    name: md.obsidian.Obsidian
    state: present

- name: Install GNOME Shell extension dependencies
  ansible.builtin.dnf:
    name: "{{ desktop_gnome_managed_dnf_packages }}"
    state: present

- name: Ensure local GNOME Shell extensions directory exists
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ desktop_gnome_shell_extensions_dir }}"
    state: directory
    mode: "0755"

- name: Install GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ desktop_gnome_shell_extensions_dir }}/{{ item.uuid }}"
    update: true
  loop: "{{ desktop_gnome_shell_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Allow user GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/shell/disable-user-extensions
    value: false

- name: Read currently enabled GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: dconf read /org/gnome/shell/enabled-extensions
  register: desktop_gnome_shell_enabled_extensions_read
  changed_when: false
  failed_when: false

- name: Build GNOME Shell enabled extensions list
  ansible.builtin.set_fact:
    desktop_gnome_shell_enabled_extensions_current: >-
      {{ (desktop_gnome_shell_enabled_extensions_read.stdout
          if (desktop_gnome_shell_enabled_extensions_read.stdout | trim | length > 0
              and (desktop_gnome_shell_enabled_extensions_read.stdout | trim)[0] == '[')
          else '[]') | from_yaml }}

- name: Enable GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      {{ (desktop_gnome_shell_enabled_extensions_current
          + (desktop_gnome_shell_extensions | map(attribute='uuid') | list)) | unique | list | to_json }}

- name: Install dotfiles aliases
  become: true
  become_user: "{{ target_user }}"
  block:
    - name: Check if .bash_aliases exists
      ansible.builtin.stat:
        path: "{{ target_home }}/.bash_aliases"
      register: desktop_gnome_file_stat

    - name: Deploy .bash_aliases if it does not exit
      ansible.builtin.copy:
        src: "{{ role_path }}/files/dotfiles/bash_aliases"
        dest: "{{ target_home }}/.bash_aliases"
        mode: "0644"
      when: not desktop_gnome_file_stat.stat.exists

    - name: Ensure .bashrc sources aliases
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.bashrc"
        line: '[[ -f ~/.bash_aliases ]] && . ~/.bash_aliases'
        create: true
        mode: "0644"
        state: present

    - name: Ensure .zshrc sources aliases
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.zshrc"
        line: '[[ -f ~/.bash_aliases ]] && source ~/.bash_aliases'
        create: true
        mode: "0644"
        state: present

- name: Set GNOME time and calendar properties
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_time_and_calendar_properties }}"

- name: Set GNOME navigation shortcuts
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_navigation_shortcuts }}"

- name: Read GNOME custom keyboard shortcuts
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - dconf
      - read
      - /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
  register: desktop_gnome_custom_shortcuts_read
  changed_when: false
  failed_when: false

- name: Merge the Ptyxis shortcuts into GNOME custom keyboard shortcuts
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    value: >-
      {{ (((desktop_gnome_custom_shortcuts_read.stdout | default(''))
           | regex_findall("(?<=')[^']+/(?=')"))
          + (desktop_gnome_ptyxis_shortcuts | map(attribute='path') | list))
         | unique | list | to_json }}

- name: Configure the Ptyxis shortcuts
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.0.path }}{{ item.1 }}"
    value: "{{ item.0[item.1] | string | to_json }}"
  loop: "{{ desktop_gnome_ptyxis_shortcuts | product(['name', 'command', 'binding']) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Disable alert sound (terminal 'dingding' noise)
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_alert_sound }}"

- name: Enable battery percentage in top bar
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_battery_percentage }}"

- name: Set mouse and touchpad settings
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_mouse_touchpad }}"

- name: Disable GNOME hot corner (top-left)
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ desktop_gnome_hot_corner }}"

- name: Add both DE and US keyboard layout
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value | string }}"  # filter enforces string representation
  loop: "{{ desktop_gnome_german_us_keyboard_layout }}"
