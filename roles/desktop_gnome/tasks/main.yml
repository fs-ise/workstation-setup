---
- name: Ensure RPM Fusion repos are available
  ansible.builtin.include_role:
    name: repo_rpmfusion

- name: Install Dropbox and Nautilus extension (RPMFusion)
  ansible.builtin.dnf:
    name:
      - dropbox
      - nautilus-dropbox
    state: present
    update_cache: true
  failed_when: false

- name: Install Obsidian and Vorta via Flatpak
  community.general.flatpak:
    name: "{{ item }}"
    state: present
  loop:
    - md.obsidian.Obsidian
    - com.borgbase.Vorta

- name: Install GNOME Shell extension dependencies
  ansible.builtin.dnf:
    name:
      - git
      - dconf
      - python3-psutil
    state: present

- name: Ensure local GNOME Shell extensions directory exists
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ gnome_shell_extensions_dir }}"
    state: directory
    mode: "0755"

- name: Install GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ gnome_shell_extensions_dir }}/{{ item.uuid }}"
    update: true
  loop: "{{ gnome_shell_extensions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Allow user GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/shell/disable-user-extensions
    value: false

- name: Read currently enabled GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    cmd: dconf read /org/gnome/shell/enabled-extensions
  register: gnome_shell_enabled_extensions_read
  changed_when: false
  failed_when: false

- name: Build GNOME Shell enabled extensions list
  ansible.builtin.set_fact:
    gnome_shell_enabled_extensions_current: >-
      {{ (gnome_shell_enabled_extensions_read.stdout
          if (gnome_shell_enabled_extensions_read.stdout | trim | length > 0
              and (gnome_shell_enabled_extensions_read.stdout | trim)[0] == '[')
          else '[]') | from_yaml }}

- name: Enable GNOME Shell extensions
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      {{ (gnome_shell_enabled_extensions_current
          + (gnome_shell_extensions | map(attribute='uuid') | list)) | unique | list | to_json }}

- name: Install dotfiles aliases
  become: true
  become_user: "{{ target_user }}"
  block:
    - name: Check if .bash_aliases exists
      ansible.builtin.stat:
        path: "{{ target_home }}/.bash_aliases"
      register: file_stat

    - name: Deploy .bash_aliases if it does not exit
      ansible.builtin.copy:
        src: "{{ role_path }}/files/dotfiles/bash_aliases"
        dest: "{{ target_home }}/.bash_aliases"
        mode: "0644"
      when: not file_stat.stat.exists

    - name: Ensure .bashrc sources aliases
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.bashrc"
        line: '[[ -f ~/.bash_aliases ]] && . ~/.bash_aliases'
        create: true
        mode: "0644"
        state: present

    - name: Ensure .zshrc sources aliases
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.zshrc"
        line: '[[ -f ~/.bash_aliases ]] && source ~/.bash_aliases'
        create: true
        mode: "0644"
        state: present

- name: Set GNOME time and calendar properties
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_time_and_calendar_properties }}"

- name: Add Ubuntu-like shortcuts
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_navigation_shortcuts + gnome_custom_shortcuts }}"

- name: Disable alert sound (terminal 'dingding' noise)
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_alert_sound }}"

- name: Enable battery percentage in top bar
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_battery_percentage }}"

- name: Set mouse and touchpad settings
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_mouse_touchpad }}"

- name: Disable GNOME hot corner (top-left)
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ gnome_hot_corner }}"

- name: Configure Nemo thumbnail previews
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ nemo_preview_preferences }}"

- name: Add both DE and US keyboard layout
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value | string }}"  # filter enforces string representation
  loop: "{{ german_us_keyboard_layout }}"
