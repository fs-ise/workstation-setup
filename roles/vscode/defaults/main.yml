---
vscode_repo_name: "vscode"
vscode_rpm_package: "code"
vscode_flatpak_id: "com.visualstudio.code"
vscode_rpm_desktop_id: "code.desktop"
vscode_flatpak_desktop_id: "com.visualstudio.code.desktop"
vscode_extensions:
  - ms-python.python
  - ms-toolsai.jupyter
  - ms-vscode.makefile-tools
  - ms-azuretools.vscode-docker
  - eamodio.gitlens
  - streetsidesoftware.code-spell-checker
  - yzhang.markdown-all-in-one
  - davidanson.vscode-markdownlint
  - davidlday.languagetool-linter
  - quarto.quarto
  - telesoho.vscode-markdown-paste-image
  - redhat.vscode-yaml
  - tamasfe.even-better-toml
  - esbenp.prettier-vscode

# DNF packages owned by this role; consumed by the package audit.
vscode_clipboard_packages:
  - xclip
vscode_managed_dnf_packages: "{{ [vscode_rpm_package] + vscode_clipboard_packages }}"
