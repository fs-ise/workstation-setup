---
- name: Import Microsoft signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add VS Code yum repo
  ansible.builtin.yum_repository:
    name: "{{ vscode_repo_name }}"
    description: "Visual Studio Code"
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Prefer the RPM installation of VS Code
  block:
    - name: Install VS Code via dnf
      ansible.builtin.dnf:
        name: "{{ vscode_rpm_package }}"
        state: present
        update_cache: true

    - name: Select the RPM desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_rpm_desktop_id }}"
        vscode_install_method: rpm
  rescue:
    - name: Install VS Code via Flatpak fallback
      community.general.flatpak:
        name: "{{ vscode_flatpak_id }}"
        state: present

    - name: Select the Flatpak desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_flatpak_desktop_id }}"
        vscode_install_method: flatpak

- name: Validate the selected VS Code desktop entry
  ansible.builtin.assert:
    that:
      - vscode_install_method in ['rpm', 'flatpak']
      - vscode_desktop_id in [vscode_rpm_desktop_id, vscode_flatpak_desktop_id]
      - (vscode_install_method == 'rpm' and vscode_desktop_id == vscode_rpm_desktop_id)
        or (vscode_install_method == 'flatpak' and vscode_desktop_id == vscode_flatpak_desktop_id)
    quiet: true

- name: Install Linux clipboard integration for Markdown Paste
  ansible.builtin.dnf:
    name: "{{ vscode_clipboard_packages }}"
    state: present

- name: Install VS Code extensions with code CLI (best effort)
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v code >/dev/null 2>&1; then
      {% for extension in vscode_extensions %}
      code --install-extension {{ extension }} --force || true
      {% endfor %}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Install VS Code extensions for Flatpak (best effort)
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v flatpak >/dev/null 2>&1 && flatpak info {{ vscode_flatpak_id }} >/dev/null 2>&1; then
      {% for extension in vscode_extensions %}
      flatpak run {{ vscode_flatpak_id }} --install-extension {{ extension }} --force || true
      {% endfor %}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
