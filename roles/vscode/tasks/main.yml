---
- name: Import Microsoft signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add VS Code yum repo
  ansible.builtin.yum_repository:
    name: "{{ vscode_repo_name }}"
    description: "Visual Studio Code"
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Prefer the RPM installation of VS Code
  block:
    - name: Install VS Code via dnf
      ansible.builtin.dnf:
        name: "{{ vscode_rpm_package }}"
        state: present
        update_cache: true

    - name: Select the RPM desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_rpm_desktop_id }}"
        vscode_install_method: rpm
  rescue:
    - name: Install VS Code via Flatpak fallback
      community.general.flatpak:
        name: "{{ vscode_flatpak_id }}"
        state: present

    - name: Select the Flatpak desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_flatpak_desktop_id }}"
        vscode_install_method: flatpak

- name: Validate the selected VS Code desktop entry
  ansible.builtin.assert:
    that:
      - vscode_install_method in ['rpm', 'flatpak']
      - vscode_desktop_id in [vscode_rpm_desktop_id, vscode_flatpak_desktop_id]
      - (vscode_install_method == 'rpm' and vscode_desktop_id == vscode_rpm_desktop_id)
        or (vscode_install_method == 'flatpak' and vscode_desktop_id == vscode_flatpak_desktop_id)
    quiet: true

- name: Install Linux clipboard integration for Markdown Paste
  ansible.builtin.dnf:
    name: "{{ vscode_clipboard_packages }}"
    state: present

- name: List installed VS Code extensions from the RPM installation
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv: [code, --list-extensions]
  register: vscode_rpm_extensions
  changed_when: false
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  when: vscode_install_method == 'rpm'

- name: Install missing VS Code extensions with code CLI
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv: [code, --install-extension, "{{ item }}"]
  loop: "{{ vscode_extensions }}"
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  when:
    - vscode_install_method == 'rpm'
    - item not in vscode_rpm_extensions.stdout_lines

- name: List installed VS Code extensions from the Flatpak installation
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv: [flatpak, run, "{{ vscode_flatpak_id }}", --list-extensions]
  register: vscode_flatpak_extensions
  changed_when: false
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  when: vscode_install_method == 'flatpak'

- name: Install missing VS Code extensions for Flatpak
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - flatpak
      - run
      - "{{ vscode_flatpak_id }}"
      - --install-extension
      - "{{ item }}"
  loop: "{{ vscode_extensions }}"
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  when:
    - vscode_install_method == 'flatpak'
    - item not in vscode_flatpak_extensions.stdout_lines
