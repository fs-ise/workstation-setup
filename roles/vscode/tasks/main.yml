---
- name: Import Microsoft signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Add VS Code yum repo
  ansible.builtin.yum_repository:
    name: "{{ vscode_repo_name }}"
    description: "Visual Studio Code"
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    enabled: true
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc

- name: Prefer the RPM installation of VS Code
  block:
    - name: Install VS Code via dnf
      ansible.builtin.dnf:
        name: "{{ vscode_rpm_package }}"
        state: present
        update_cache: true

    - name: Select the RPM desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_rpm_desktop_id }}"
        vscode_install_method: rpm
  rescue:
    - name: Install VS Code via Flatpak fallback
      community.general.flatpak:
        name: "{{ vscode_flatpak_id }}"
        state: present

    - name: Select the Flatpak desktop entry
      ansible.builtin.set_fact:
        vscode_desktop_id: "{{ vscode_flatpak_desktop_id }}"
        vscode_install_method: flatpak

- name: Validate the selected VS Code desktop entry
  ansible.builtin.assert:
    that:
      - vscode_install_method in ['rpm', 'flatpak']
      - vscode_desktop_id in [vscode_rpm_desktop_id, vscode_flatpak_desktop_id]
      - (vscode_install_method == 'rpm' and vscode_desktop_id == vscode_rpm_desktop_id)
        or (vscode_install_method == 'flatpak' and vscode_desktop_id == vscode_flatpak_desktop_id)
    quiet: true

- name: Install Linux clipboard integration for Markdown Paste
  ansible.builtin.dnf:
    name: xclip
    state: present

- name: Ensure VS Code user settings directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop: "{{ vscode_user_config_dirs }}"

- name: Write global VS Code keybindings.json
  ansible.builtin.copy:
    dest: "{{ item }}/keybindings.json"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
    content: "{{ vscode_keybindings | to_nice_json(indent=2) }}"
  loop: "{{ vscode_user_config_dirs }}"

- name: Write global VS Code settings.json
  ansible.builtin.copy:
    dest: "{{ item }}/settings.json"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
    content: "{{ vscode_settings | to_nice_json(indent=2) }}"
  loop: "{{ vscode_user_config_dirs }}"

- name: Ensure the user MIME package directory exists
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ target_home }}/.local/share/mime/packages"
    state: directory
    mode: "0755"

- name: Register the Quarto MIME type for qmd files
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/share/mime/packages/quarto.xml"
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <mime-info xmlns="http://www.freedesktop.org/standards/shared-mime-info">
        <mime-type type="{{ vscode_quarto_mime_type }}">
          <comment>Quarto document</comment>
          <glob pattern="*.qmd"/>
        </mime-type>
      </mime-info>
  environment:
    HOME: "{{ target_home }}"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  notify: Update user MIME database

- name: Apply pending user MIME database changes
  ansible.builtin.meta: flush_handlers

- name: Ensure the user applications configuration directory exists
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ target_home }}/.config"
    state: directory
    mode: "0755"

- name: Set VS Code as default editor for common text formats
  become: true
  become_user: "{{ target_user }}"
  community.general.ini_file:
    path: "{{ target_home }}/.config/mimeapps.list"
    section: "Default Applications"
    option: "{{ item }}"
    value: "{{ vscode_desktop_id }};"
    mode: "0644"
    no_extra_spaces: true
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  loop: "{{ vscode_mime_types }}"

- name: Query the Quarto default application
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - xdg-mime
      - query
      - default
      - "{{ vscode_quarto_mime_type }}"
  environment:
    HOME: "{{ target_home }}"
    XDG_CONFIG_HOME: "{{ target_home }}/.config"
    XDG_DATA_HOME: "{{ target_home }}/.local/share"
  register: vscode_quarto_mime_default
  changed_when: false

- name: Verify the Quarto default application
  ansible.builtin.assert:
    that:
      - vscode_quarto_mime_default.stdout == vscode_desktop_id
    fail_msg: >-
      Expected {{ vscode_desktop_id }} as the default application for
      {{ vscode_quarto_mime_type }}, got
      {{ vscode_quarto_mime_default.stdout | default('no desktop entry') }}.
    quiet: true

- name: Install VS Code extensions with code CLI (best effort)
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v code >/dev/null 2>&1; then
      {% for extension in vscode_extensions %}
      code --install-extension {{ extension }} --force || true
      {% endfor %}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Install VS Code extensions for Flatpak (best effort)
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v flatpak >/dev/null 2>&1 && flatpak info {{ vscode_flatpak_id }} >/dev/null 2>&1; then
      {% for extension in vscode_extensions %}
      flatpak run {{ vscode_flatpak_id }} --install-extension {{ extension }} --force || true
      {% endfor %}
    fi
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
