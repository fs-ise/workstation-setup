---
- name: Ensure RPM Fusion repos are available
  ansible.builtin.include_role:
    name: repo_rpmfusion

- name: Remove Oracle VirtualBox repo file if present
  ansible.builtin.file:
    path: /etc/yum.repos.d/virtualbox.repo
    state: absent
  failed_when: false

- name: Remove Oracle VirtualBox packages if present (avoid conflicts)
  ansible.builtin.dnf:
    name:
      - VirtualBox-7.2
      - VirtualBox-7.1
      - VirtualBox-7.0
      - VirtualBox-6.1
      - VirtualBox-qt
      - VirtualBox-kmodsrc
    state: absent
  failed_when: false

- name: Install VirtualBox (Fedora/RPMFusion) + kernel module tooling
  ansible.builtin.dnf:
    name:
      - VirtualBox
      - VirtualBox-server
      - akmod-VirtualBox
      - virtualbox-guest-additions
      - kernel-devel
      - kernel-headers
    state: present
    update_cache: true

- name: Ensure vboxusers group exists
  ansible.builtin.group:
    name: vboxusers
    state: present

- name: Add invoking user to vboxusers group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: vboxusers
    append: true

- name: Read VirtualBox Host Key combination
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - VBoxManage
      - getextradata
      - global
      - GUI/Input/HostKeyCombination
  environment:
    HOME: "{{ target_home }}"
  register: virtualbox_host_key_current
  changed_when: false
  when: virtualbox_configure_host_key | bool

- name: Configure VirtualBox Host Key combination
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - VBoxManage
      - setextradata
      - global
      - GUI/Input/HostKeyCombination
      - "{{ virtualbox_host_key_combination }}"
  environment:
    HOME: "{{ target_home }}"
  when:
    - virtualbox_configure_host_key | bool
    - >-
      virtualbox_host_key_current.stdout | trim !=
      'Value: ' ~ virtualbox_host_key_combination
