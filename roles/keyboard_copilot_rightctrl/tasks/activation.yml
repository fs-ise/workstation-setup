---
- name: Validate Copilot key remapping mode
  ansible.builtin.assert:
    that:
      - keyboard_copilot_rightctrl_mode in ["auto", "enabled", "disabled"]
    fail_msg: >-
      keyboard_copilot_rightctrl_mode must be one of: auto, enabled, disabled

- name: Initialize automatic Copilot key model match
  ansible.builtin.set_fact:
    keyboard_copilot_rightctrl_auto_product_match: false

- name: Match recognized Copilot key laptop models
  ansible.builtin.set_fact:
    keyboard_copilot_rightctrl_auto_product_match: true
  loop: "{{ keyboard_copilot_rightctrl_product_name_patterns }}"
  loop_control:
    label: "{{ item }}"
  when: ansible_facts["product_name"] is regex(item)

- name: Derive Copilot key remapping activation
  ansible.builtin.set_fact:
    keyboard_copilot_rightctrl_active: >-
      {{
        keyboard_copilot_rightctrl_mode == "enabled" or
        (
          keyboard_copilot_rightctrl_mode == "auto" and
          ansible_facts["system_vendor"] in keyboard_copilot_rightctrl_system_vendors and
          keyboard_copilot_rightctrl_auto_product_match
        )
      }}

- name: Explain Copilot key remapping activation
  ansible.builtin.debug:
    msg: >-
      Copilot key remapping mode={{ keyboard_copilot_rightctrl_mode }};
      detected vendor={{ ansible_facts["system_vendor"] | default("unknown", true) }},
      product={{ ansible_facts["product_name"] | default("unknown", true) }};
      active={{ keyboard_copilot_rightctrl_active | bool }};
      reason={{
        "explicitly enabled" if keyboard_copilot_rightctrl_mode == "enabled" else
        "explicitly disabled" if keyboard_copilot_rightctrl_mode == "disabled" else
        "recognized vendor and product" if keyboard_copilot_rightctrl_active else
        "vendor or product is not in the auto-mode allowlist"
      }}.
