---
- name: Create LanguageTool data directory
  ansible.builtin.file:
    path: "{{ languagetool_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create build directory
  ansible.builtin.file:
    path: "{{ languagetool_data_dir }}/build"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download custom dictionary
  ansible.builtin.get_url:
    url: "{{ languagetool_dict_url }}"
    dest: "{{ languagetool_data_dir }}/build/spelling.txt"
    owner: root
    group: root
    mode: "0644"
  register: languagetool_dictionary

- name: Create Dockerfile for custom LanguageTool image
  ansible.builtin.copy:
    dest: "{{ languagetool_data_dir }}/build/Dockerfile"
    content: |
      FROM {{ languagetool_image }}
      USER root
      COPY spelling.txt /tmp/spelling.txt
      RUN (echo; cat /tmp/spelling.txt) >> /LanguageTool/org/languagetool/resource/en/hunspell/spelling.txt
      USER languagetool
    owner: root
    group: root
    mode: "0644"
  register: languagetool_dockerfile

- name: Build custom LanguageTool image
  community.docker.docker_image:
    name: "{{ languagetool_custom_image }}"
    source: build
    build:
      path: "{{ languagetool_data_dir }}/build"
    force_source: >-
      {{
        languagetool_dictionary.changed
        or languagetool_dockerfile.changed
      }}
  register: languagetool_image_build

- name: Run LanguageTool container
  community.docker.docker_container:
    name: "{{ languagetool_container_name }}"
    image: "{{ languagetool_custom_image }}"
    restart_policy: always
    state: started
    recreate: "{{ languagetool_image_build.changed }}"
    published_ports:
      - "127.0.0.1:{{ languagetool_port }}:{{ languagetool_container_port }}"
