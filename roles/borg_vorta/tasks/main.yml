---
- name: Install BorgBackup
  ansible.builtin.dnf:
    name: "{{ borg_vorta_packages }}"
    state: present
  when: borg_vorta_packages | length > 0

- name: Ensure Flatpak is installed for Vorta
  ansible.builtin.dnf:
    name: flatpak
    state: present
  when: borg_vorta_install_vorta | bool

- name: Ensure Flathub is available for Vorta
  become: true
  become_user: "{{ target_user }}"
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user
  when:
    - borg_vorta_install_vorta | bool
    - borg_vorta_configure_flathub | bool

- name: Install Vorta
  become: true
  become_user: "{{ target_user }}"
  community.general.flatpak:
    name: "{{ borg_vorta_vorta_flatpak_id }}"
    state: present
    method: user
  when: borg_vorta_install_vorta | bool
