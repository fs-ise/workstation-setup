---
- name: Install additional LaTeX packages
  ansible.builtin.dnf:
    name: "{{ latex_additional_packages }}"
    state: present
  when: latex_additional_packages | length > 0

- name: Install the full TeX Live scheme
  ansible.builtin.dnf:
    name: texlive-scheme-full
    state: present
  when: latex_install_texlive_scheme_full | bool

- name: Check whether Quarto-managed TinyTeX is installed
  ansible.builtin.stat:
    path: "{{ target_home }}/.TinyTeX/bin"
  register: latex_tinytex_bin
  become: true
  become_user: "{{ target_user }}"
  when: not (latex_install_texlive_scheme_full | bool)

- name: Install TinyTeX through Quarto
  ansible.builtin.command:
    argv:
      - quarto
      - install
      - tinytex
      - --no-prompt
      - --update-path
  environment:
    HOME: "{{ target_home }}"
  become: true
  become_user: "{{ target_user }}"
  when:
    - not (latex_install_texlive_scheme_full | bool)
    - not (latex_tinytex_bin.stat.isdir | default(false))
