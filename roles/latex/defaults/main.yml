---
latex_install_texlive_scheme_full: true

latex_texlive_packages:
  - texlive-lang-german
  - texlive-latex-extra
  - texlive-xetex

latex_additional_packages:
  - texstudio

# DNF packages owned by this role; consumed by the package audit.
latex_managed_dnf_packages: >-
  {{ latex_texlive_packages + latex_additional_packages + ['texlive-scheme-full'] }}
