---
- name: Require a supported VeraCrypt platform
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Fedora"
      - >-
        ansible_facts["distribution_major_version"]
        in veracrypt_tested_fedora_versions
      - ansible_facts["architecture"] == veracrypt_architecture
    fail_msg: >-
      VeraCrypt {{ veracrypt_version }} installation is configured for tested
      Fedora workstation versions
      {{ veracrypt_tested_fedora_versions | join(', ') }} on
      {{ veracrypt_architecture }}; detected
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_major_version"] }} on
      {{ ansible_facts["architecture"] }}.
