---
- name: Validate VeraCrypt platform support
  ansible.builtin.include_tasks: platform.yml

- name: Install VeraCrypt verification dependencies
  ansible.builtin.dnf:
    name: "{{ veracrypt_verification_packages }}"
    state: present

- name: Read the installed VeraCrypt version # noqa command-instead-of-module
  ansible.builtin.command:
    argv:
      - rpm
      - --query
      - --queryformat
      - "%{VERSION}"
      - veracrypt
  register: veracrypt_installed
  changed_when: false
  failed_when: veracrypt_installed.rc not in [0, 1]

- name: Record whether the installed VeraCrypt version is satisfactory
  ansible.builtin.set_fact:
    veracrypt_version_satisfied: >-
      {{
        veracrypt_installed.rc == 0
        and veracrypt_installed.stdout is version(veracrypt_version, '>=')
      }}

- name: Select VeraCrypt installation behavior
  ansible.builtin.include_tasks: decision.yml

- name: Install the pinned VeraCrypt RPM
  when: veracrypt_install_required | bool
  block:
    - name: Create an isolated VeraCrypt verification directory
      ansible.builtin.tempfile:
        state: directory
        suffix: veracrypt
      register: veracrypt_tempdir

    - name: Download and verify VeraCrypt
      block:
        - name: Download the VeraCrypt signing key
          ansible.builtin.get_url:
            url: "{{ veracrypt_signing_key_url }}"
            dest: "{{ veracrypt_tempdir.path }}/signing-key.asc"
            mode: "0600"
            timeout: "{{ veracrypt_download_timeout }}"
          register: veracrypt_signing_key_download
          retries: "{{ veracrypt_download_retries }}"
          delay: "{{ veracrypt_download_delay }}"
          until: veracrypt_signing_key_download is succeeded

        - name: Inspect the VeraCrypt signing-key fingerprint
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --homedir
              - "{{ veracrypt_tempdir.path }}"
              - --with-colons
              - --import-options
              - show-only
              - --import
              - "{{ veracrypt_tempdir.path }}/signing-key.asc"
          register: veracrypt_key_details
          changed_when: false

        - name: Require the pinned VeraCrypt signing-key fingerprint
          ansible.builtin.assert:
            that:
              - >-
                ('fpr:::::::::' ~ veracrypt_signing_key_fingerprint ~ ':')
                in veracrypt_key_details.stdout
            fail_msg: >-
              The downloaded VeraCrypt signing key does not have the pinned
              fingerprint {{ veracrypt_signing_key_fingerprint }}.

        - name: Import the key into the isolated GPG home
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --homedir
              - "{{ veracrypt_tempdir.path }}"
              - --import
              - "{{ veracrypt_tempdir.path }}/signing-key.asc"
          changed_when: false

        - name: Export the isolated VeraCrypt verification keyring
          ansible.builtin.command:
            argv:
              - gpg
              - --batch
              - --homedir
              - "{{ veracrypt_tempdir.path }}"
              - --output
              - "{{ veracrypt_tempdir.path }}/trustedkeys.gpg"
              - --export
              - "{{ veracrypt_signing_key_fingerprint }}"
          changed_when: false

        - name: Download the pinned graphical VeraCrypt RPM
          ansible.builtin.get_url:
            url: "{{ veracrypt_package_url }}"
            dest: "{{ veracrypt_tempdir.path }}/{{ veracrypt_rpm_filename }}"
            mode: "0600"
            timeout: "{{ veracrypt_download_timeout }}"
          register: veracrypt_download
          retries: "{{ veracrypt_download_retries }}"
          delay: "{{ veracrypt_download_delay }}"
          until: veracrypt_download is succeeded

        - name: Download the detached VeraCrypt RPM signature
          ansible.builtin.get_url:
            url: "{{ veracrypt_signature_url }}"
            dest: "{{ veracrypt_tempdir.path }}/{{ veracrypt_rpm_filename }}.sig"
            mode: "0600"
            timeout: "{{ veracrypt_download_timeout }}"
          register: veracrypt_signature_download
          retries: "{{ veracrypt_download_retries }}"
          delay: "{{ veracrypt_download_delay }}"
          until: veracrypt_signature_download is succeeded

        - name: Verify the VeraCrypt RPM with the isolated keyring
          ansible.builtin.command:
            argv:
              - gpgv
              - --keyring
              - "{{ veracrypt_tempdir.path }}/trustedkeys.gpg"
              - "{{ veracrypt_tempdir.path }}/{{ veracrypt_rpm_filename }}.sig"
              - "{{ veracrypt_tempdir.path }}/{{ veracrypt_rpm_filename }}"
          changed_when: false

        - name: Import the verified VeraCrypt RPM-signing key
          ansible.builtin.rpm_key:
            key: "{{ veracrypt_tempdir.path }}/signing-key.asc"
            fingerprint: "{{ veracrypt_signing_key_fingerprint }}"
            state: present

        - name: Install the graphical VeraCrypt RPM
          ansible.builtin.dnf:
            name: "{{ veracrypt_tempdir.path }}/{{ veracrypt_rpm_filename }}"
            state: present
      always:
        - name: Remove the VeraCrypt verification directory
          ansible.builtin.file:
            path: "{{ veracrypt_tempdir.path }}"
            state: absent
