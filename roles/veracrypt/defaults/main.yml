---
# Pin the audited artifact for reproducibility. The isolated keyring prevents
# unrelated globally trusted keys from validating it, and a newer installed
# version must never be downgraded automatically.
veracrypt_version: "1.26.24"
veracrypt_tested_fedora_versions:
  - "42"
  - "43"
  - "44"
veracrypt_architecture: x86_64
veracrypt_rpm_fedora_version: "40"
veracrypt_verification_packages:
  - gnupg2
veracrypt_rpm_filename: >-
  veracrypt-{{ veracrypt_version }}-Fedora-{{ veracrypt_rpm_fedora_version }}-{{ veracrypt_architecture }}.rpm
veracrypt_signing_key_url: >-
  https://www.idrix.fr/VeraCrypt/VeraCrypt_PGP_public_key.asc
veracrypt_signing_key_fingerprint: >-
  5069A233D55A0EEB174A5FC3821ACD02680D16DE
veracrypt_package_url: >-
  https://launchpad.net/veracrypt/trunk/{{ veracrypt_version }}/+download/{{ veracrypt_rpm_filename }}
veracrypt_signature_url: "{{ veracrypt_package_url }}.sig"

# DNF packages owned by this role; consumed by the package audit.
veracrypt_managed_dnf_packages: "{{ veracrypt_verification_packages + ['veracrypt'] }}"
