---

- name: Install Nemo
  ansible.builtin.dnf:
    name: "{{ nemo_packages }}"
    state: present
  when: nemo_packages | length > 0

- name: Remove obsolete Nemo packages
  ansible.builtin.dnf:
    name: "{{ nemo_obsolete_packages }}"
    state: absent
  when: nemo_obsolete_packages | length > 0

- name: Configure Nemo preview preferences
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ nemo_preview_preferences }}"
  when: nemo_configure_preferences | bool

- name: Create Nemo action directories
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ nemo_action_directory }}"
    - "{{ nemo_actions_layout_directory }}"
    - "{{ nemo_layout_helper_directory }}"
  when: nemo_configure_ptyxis_action | bool

- name: Install the Ptyxis Nemo action
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    dest: "{{ nemo_action_path }}"
    mode: "0644"
    content: |
      [Nemo Action]
      Name=Open Terminal Here
      Comment=Open a separate Ptyxis Bash terminal here
      Exec={{ nemo_action_command }}
      Selection=any
      Extensions=any;
      Dependencies={{ nemo_action_package }};
      UriScheme=file
      Terminal=false
      Icon-Name=org.gnome.Ptyxis
      Quote=double
  when: nemo_configure_ptyxis_action | bool

- name: Install the Ptyxis working-directory helper
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    src: open-ptyxis-here.py
    dest: "{{ nemo_ptyxis_helper_path }}"
    mode: "0755"
  when: nemo_configure_ptyxis_action | bool

- name: Install the Nemo action layout merge helper
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.copy:
    src: merge_nemo_action_layout.py
    dest: "{{ nemo_layout_helper_path }}"
    mode: "0755"
  when: nemo_configure_ptyxis_action | bool

- name: Bind the Ptyxis Nemo action to {{ nemo_action_shortcut }}
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - "{{ nemo_layout_helper_path }}"
      - "{{ nemo_actions_layout_path }}"
      - "{{ nemo_action_name }}"
      - "{{ nemo_action_shortcut }}"
  register: nemo_action_layout_merge
  changed_when: nemo_action_layout_merge.stdout == 'changed'
  when: nemo_configure_ptyxis_action | bool

- name: Read GNOME custom keyboard shortcuts for Nemo
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - dconf
      - read
      - /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
  register: nemo_custom_shortcuts_read
  changed_when: false
  failed_when: false
  when: nemo_configure_shortcut | bool

- name: Merge the Nemo shortcut into GNOME custom keyboard shortcuts
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings
    value: >-
      {{ (((nemo_custom_shortcuts_read.stdout | default(''))
           | regex_findall("(?<=')[^']+/(?=')"))
          + [nemo_shortcut_path]) | unique | list | to_json }}
  when: nemo_configure_shortcut | bool

- name: Configure the Nemo shortcut
  become: true
  become_user: "{{ target_user }}"
  community.general.dconf:
    key: "{{ nemo_shortcut_path }}{{ item.key }}"
    value: "{{ item.value | string }}"
  loop:
    - key: name
      value: "'{{ nemo_shortcut_name }}'"
    - key: command
      value: "'{{ nemo_shortcut_command }}'"
    - key: binding
      value: "'{{ nemo_shortcut_binding }}'"
  when: nemo_configure_shortcut | bool
