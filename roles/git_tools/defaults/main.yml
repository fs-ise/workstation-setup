---
git_tools_packages:
  - git
  - git-lfs
  - gitk

git_tools_global_config:
  - name: log.date
    value: iso
  - name: push.autoSetupRemote
    value: "true"
  - name: init.defaultBranch
    value: main

# DNF packages owned by this role; consumed by the package audit.
git_tools_managed_dnf_packages: "{{ git_tools_packages }}"
