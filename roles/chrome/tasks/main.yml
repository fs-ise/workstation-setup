---
- name: Import Google Linux signing key
  ansible.builtin.rpm_key:
    state: present
    key: https://dl.google.com/linux/linux_signing_key.pub

- name: Add Google Chrome yum repo
  ansible.builtin.yum_repository:
    name: google-chrome
    description: google-chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
    enabled: true
    gpgcheck: true
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub

- name: Install Google Chrome
  ansible.builtin.dnf:
    name: "{{ chrome_managed_dnf_packages }}"
    state: present
    update_cache: true

- name: Create Chrome managed policy directory
  ansible.builtin.file:
    path: "{{ chrome_extension_policy_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: chrome_extensions_enabled | bool

- name: Configure standard Chrome extensions
  ansible.builtin.template:
    src: extension-settings.json.j2
    dest: "{{ chrome_extension_policy_directory }}/{{ chrome_extension_policy_file }}"
    owner: root
    group: root
    mode: "0644"
  when: chrome_extensions_enabled | bool

- name: Remove repository-managed extension policy when disabled
  ansible.builtin.file:
    path: "{{ chrome_extension_policy_directory }}/{{ chrome_extension_policy_file }}"
    state: absent
  when: not (chrome_extensions_enabled | bool)
