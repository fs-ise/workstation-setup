---
- name: Verify that RStudio Desktop supports this architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] == 'x86_64'
    fail_msg: >-
      RStudio Desktop {{ rstudio_version }} is configured only for x86-64 Fedora;
      detected architecture {{ ansible_facts["architecture"] }}.

- name: Validate CRAN installation settings
  ansible.builtin.assert:
    that:
      - (rstudio_cran_download_timeout | string) is match('^[0-9]+$')
      - rstudio_cran_download_timeout | int > 0
      - (rstudio_cran_install_attempts | string) is match('^[0-9]+$')
      - rstudio_cran_install_attempts | int >= 1
      - (rstudio_cran_retry_delay | string) is match('^[0-9]+$')
      - rstudio_cran_retry_delay | int >= 0
    fail_msg: >-
      CRAN settings must use integer values: download timeout must be positive,
      install attempts must be at least one, and retry delay must be non-negative.

- name: Install R and CRAN package build dependencies
  ansible.builtin.dnf:
    name: "{{ rstudio_system_packages }}"
    state: present

- name: Read installed package versions
  ansible.builtin.package_facts:
    manager: auto

- name: Install pinned RStudio Desktop release
  when: >-
    rstudio_install_desktop | bool and
    ('rstudio' not in ansible_facts["packages"] or
    rstudio_version not in (ansible_facts["packages"]["rstudio"] | map(attribute='version') | list))
  block:
    - name: Import the Posit RPM signing key
      ansible.builtin.rpm_key:
        state: present
        key: "{{ rstudio_rpm_signing_key_url }}"
        fingerprint:
          - "{{ rstudio_rpm_signing_key_fingerprint }}"
        validate_certs: true

    - name: Create the RStudio RPM cache directory
      ansible.builtin.file:
        path: "{{ rstudio_rpm_download_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the pinned RStudio Desktop RPM
      ansible.builtin.get_url:
        url: "{{ rstudio_download_url }}"
        dest: "{{ rstudio_rpm_download_directory }}/{{ rstudio_rpm_filename }}"
        checksum: "{{ rstudio_rpm_checksum if rstudio_rpm_checksum | length > 0 else omit }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the pinned RStudio Desktop RPM
      ansible.builtin.dnf:
        name: "{{ rstudio_rpm_download_directory }}/{{ rstudio_rpm_filename }}"
        state: present
        disable_gpg_check: false

- name: Create the user R package library
  ansible.builtin.file:
    path: "{{ rstudio_user_library }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

- name: Configure the user R package library
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.Renviron"
    marker: "# {mark} ANSIBLE MANAGED R USER LIBRARY"
    block: 'R_LIBS_USER={{ rstudio_user_library }}'
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0600"

- name: Find R package lock directories
  when: rstudio_install_cran_packages | bool
  ansible.builtin.find:
    paths: "{{ rstudio_user_library }}"
    patterns: "00LOCK*"
    file_type: directory
    recurse: false
  register: rstudio_package_locks

- name: Check for active user R processes when package locks exist
  when:
    - rstudio_install_cran_packages | bool
    - rstudio_package_locks.matched | int > 0
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - pgrep
      - --uid
      - "{{ target_user }}"
      - --full
      - '(^|/)(R|Rscript|rstudio|rsession)([[:space:]]|$)'
  register: rstudio_active_processes
  changed_when: false
  failed_when: rstudio_active_processes.rc not in [0, 1]

- name: Require R and RStudio to be closed before clearing package locks
  when:
    - rstudio_install_cran_packages | bool
    - rstudio_package_locks.matched | int > 0
    - rstudio_active_processes.rc == 0
  ansible.builtin.fail:
    msg: >-
      R package lock directories exist while an R or RStudio process is running
      for {{ target_user }}. Close R and RStudio, then rerun the rstudio role.

- name: Remove stale R package lock directories
  when:
    - rstudio_install_cran_packages | bool
    - rstudio_package_locks.matched | int > 0
    - rstudio_active_processes.rc == 1
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ rstudio_package_locks.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install missing user R packages from CRAN
  when: rstudio_install_cran_packages | bool
  become: true
  become_user: "{{ target_user }}"
  ansible.builtin.command:
    argv:
      - Rscript
      - --vanilla
      - -e
      - |
        timeout <- as.integer(Sys.getenv("RSTUDIO_CRAN_DOWNLOAD_TIMEOUT", "600"))
        attempts <- as.integer(Sys.getenv("RSTUDIO_CRAN_INSTALL_ATTEMPTS", "3"))
        retry_delay <- as.integer(Sys.getenv("RSTUDIO_CRAN_RETRY_DELAY", "5"))
        options(timeout = timeout)
        library_path <- Sys.getenv("R_LIBS_USER")
        repository <- Sys.getenv("RSTUDIO_CRAN_REPOSITORY")
        wanted <- strsplit(Sys.getenv("RSTUDIO_R_PACKAGES"), ",", fixed = TRUE)[[1]]
        wanted <- trimws(wanted)
        wanted <- unique(wanted[nzchar(wanted)])

        installed_names <- function() {
          rownames(installed.packages(lib.loc = library_path, noCache = TRUE))
        }

        missing_before <- setdiff(wanted, installed_names())
        for (package in missing_before) {
          for (attempt in seq_len(attempts)) {
            message(sprintf("Installing %s: attempt %d of %d", package, attempt, attempts))
            try(
              install.packages(
                package,
                repos = repository,
                lib = library_path,
                dependencies = c("Depends", "Imports", "LinkingTo")
              ),
              silent = FALSE
            )
            if (package %in% installed_names()) break
            if (attempt < attempts && retry_delay > 0) Sys.sleep(retry_delay * attempt)
          }
        }

        still_missing <- setdiff(wanted, installed_names())
        if (length(still_missing)) {
          stop(
            "Failed to install the following configured R packages after retries: ",
            paste(still_missing, collapse = ", ")
          )
        }
        if (length(missing_before)) {
          cat("RSTUDIO_PACKAGES_INSTALLED:", paste(missing_before, collapse = ","), "\n")
        }
  environment:
    HOME: "{{ target_home }}"
    R_LIBS_USER: "{{ rstudio_user_library }}"
    RSTUDIO_CRAN_REPOSITORY: "{{ rstudio_cran_repository }}"
    RSTUDIO_R_PACKAGES: "{{ rstudio_r_packages | join(',') }}"
    RSTUDIO_CRAN_DOWNLOAD_TIMEOUT: "{{ rstudio_cran_download_timeout | string }}"
    RSTUDIO_CRAN_INSTALL_ATTEMPTS: "{{ rstudio_cran_install_attempts | string }}"
    RSTUDIO_CRAN_RETRY_DELAY: "{{ rstudio_cran_retry_delay | string }}"
  register: rstudio_package_install
  changed_when: "'RSTUDIO_PACKAGES_INSTALLED:' in rstudio_package_install.stdout"
  no_log: false
