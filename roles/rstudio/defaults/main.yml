---
# Posit's stable open-source RStudio Desktop build for Fedora x86-64.
rstudio_version: "2026.07.1+147"
rstudio_rpm_version: "{{ rstudio_version | replace('+', '-') }}"
rstudio_rpm_filename: "rstudio-{{ rstudio_rpm_version }}-x86_64.rpm"
rstudio_download_url: >-
  https://download1.rstudio.org/electron/rhel9/x86_64/{{ rstudio_rpm_filename }}
# Posit's current open-source repository signing key for builds released after
# July 25, 2023. Keep the fingerprint pinned so an unexpected key is rejected.
rstudio_rpm_signing_key_url: >-
  https://dl.posit.co/public/open/gpg.51C0B5BB19F92D60.key
rstudio_rpm_signing_key_fingerprint: >-
  8B65E5A107BBEFE3BA99C59751C0B5BB19F92D60
# Posit displays a checksum on its download page but does not provide a stable
# checksum-file URL. Set this to "sha256:<digest>" when pinning a published digest.
rstudio_rpm_checksum: ""
rstudio_rpm_download_directory: /var/cache/workstation-setup
rstudio_install_desktop: true

rstudio_system_packages:
  - R
  - R-devel
  - gcc
  - gcc-c++
  - gcc-gfortran
  - make
  - libcurl-devel
  - openssl-devel
  - libxml2-devel
  - fontconfig-devel
  - freetype-devel
  - fribidi-devel
  - harfbuzz-devel
  - libjpeg-turbo-devel
  - libpng-devel
  - libtiff-devel
  - libuv-devel
  - zlib-devel

rstudio_cran_repository: "https://cloud.r-project.org"
rstudio_cran_download_timeout: 600
rstudio_cran_install_attempts: 3
rstudio_cran_retry_delay: 5
rstudio_install_cran_packages: true
rstudio_user_library: "{{ target_home }}/R/library"
rstudio_r_packages:
  - tidyverse
  - tidymodels
  - janitor
  - skimr
  - here
  - writexl
  - openxlsx
  - knitr
  - rmarkdown
  - quarto
  - renv
  - testthat
  - languageserver
