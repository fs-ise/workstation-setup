---
thunderbird_policies_dir: /etc/thunderbird/policies
thunderbird_policies_file: "{{ thunderbird_policies_dir }}/policies.json"

thunderbird_mcp_enabled: true
thunderbird_mcp_version: "0.7.4"
thunderbird_mcp_install_dir: /opt/thunderbird-mcp
thunderbird_mcp_repository: https://github.com/TKasperczyk/thunderbird-mcp.git
thunderbird_mcp_extension_id: thunderbird-mcp@tkasperczyk.dev
thunderbird_mcp_xpi_url: >-
  https://github.com/TKasperczyk/thunderbird-mcp/releases/download/v{{ thunderbird_mcp_version }}/thunderbird-mcp-v{{ thunderbird_mcp_version }}.xpi
thunderbird_mcp_write_client_fragment: false
thunderbird_mcp_client_fragment_dir: "{{ target_home }}/.config/workstation-setup/mcp"
thunderbird_mcp_client_fragment_file: "{{ thunderbird_mcp_client_fragment_dir }}/thunderbird-mail.json"

thunderbird_base_extensions:
  - name: AI Grammar Checker & Paraphraser -- LanguageTool
    id: languagetool-mailextension@languagetool.org
    install_url: https://addons.thunderbird.net/thunderbird/downloads/latest/grammar-and-spell-checker/latest.xpi
    comment: Adds grammar, spelling, punctuation, and style checks while composing email. Use it with the local LanguageTool setup when possible.
  - name: FiltaQuilla
    id: filtaquilla@mesquilla.com
    install_url: https://addons.thunderbird.net/thunderbird/downloads/latest/filtaquilla/latest.xpi
    comment: Extends Thunderbird message filters with extra actions and search terms. Use it for workflow rules that Thunderbird cannot express by default.
  - name: mailmindr
    id: mailmindr@arndissler.net
    install_url: https://addons.thunderbird.net/thunderbird/downloads/latest/mailmindr/latest.xpi
    comment: >-
      Moves messages out of the inbox when you cannot currently act on them, then reminds you when follow-up is due.
      Use it for time-bound replies, delegated work, and review tasks.
  - name: Move Mail Shortcuts
    id: mailMoveShortcuts@extension
    install_url: https://addons.thunderbird.net/thunderbird/downloads/latest/move-mail-shortcuts/latest.xpi
    comment: Adds keyboard shortcuts for moving and copying mail to folders. Use it to file messages quickly without interrupting reading flow.
  - name: Owl for Exchange
    id: owl@beonex.com
    install_url: https://addons.thunderbird.net/thunderbird/downloads/latest/owl-for-exchange/latest.xpi
    comment: >-
      Connects Thunderbird to Exchange and Microsoft 365 accounts through Outlook Web Access when standard IMAP/SMTP or OAuth setup
      is not sufficient. Check license terms before relying on it.

thunderbird_mcp_extension:
  - name: Thunderbird MCP
    id: "{{ thunderbird_mcp_extension_id }}"
    install_url: "{{ thunderbird_mcp_xpi_url }}"
    comment: >-
      Exposes Thunderbird mail, contacts, calendars, filters, and message-management operations to local AI assistants through MCP.
      Treat it as sensitive access; enable it only when needed and review its configuration carefully.

# Extensions are installed through Thunderbird Enterprise Policies with
# installation_mode=normal_installed, not force_installed. Thunderbird installs
# them automatically, but users can still disable them.
thunderbird_extensions_enabled: true
thunderbird_extensions: >-
  {{ thunderbird_base_extensions + (thunderbird_mcp_extension if thunderbird_mcp_enabled | bool else []) }}
