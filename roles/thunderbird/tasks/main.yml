---
- name: Try to install Thunderbird via dnf
  ansible.builtin.dnf:
    name: thunderbird
    state: present
  register: thunderbird_dnf
  failed_when: false

- name: Install Thunderbird via Flatpak fallback
  community.general.flatpak:
    name: org.mozilla.Thunderbird
    state: present
  when: thunderbird_dnf is failed

- name: Install Node.js packages required by thunderbird-cli
  ansible.builtin.dnf:
    name:
      - nodejs22
      - nodejs22-npm
    state: present
  when: thunderbird_cli_enabled | bool

- name: Ensure user-local npm prefix exists
  ansible.builtin.file:
    path: "{{ thunderbird_cli_npm_prefix }}"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ target_user }}"
  when: thunderbird_cli_enabled | bool

- name: Install thunderbird-cli npm packages
  community.general.npm:
    name: "{{ item }}"
    version: "{{ thunderbird_cli_version }}"
    global: true
    state: present
  become: true
  become_user: "{{ target_user }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ thunderbird_cli_npm_prefix }}"
  loop: "{{ thunderbird_cli_npm_packages }}"
  when: thunderbird_cli_enabled | bool

- name: Install thunderbird-cli bridge system service
  ansible.builtin.template:
    src: thunderbird-cli-bridge.service.j2
    dest: "/etc/systemd/system/{{ thunderbird_cli_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Thunderbird CLI bridge
  when: thunderbird_cli_enabled | bool

- name: Enable and start thunderbird-cli bridge
  ansible.builtin.systemd_service:
    name: "{{ thunderbird_cli_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: thunderbird_cli_enabled | bool

- name: Ensure Thunderbird policies directory exists
  ansible.builtin.file:
    path: "{{ thunderbird_policies_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: thunderbird_extensions_enabled | bool

- name: Check existing Thunderbird policies file
  ansible.builtin.stat:
    path: "{{ thunderbird_policies_file }}"
  register: thunderbird_policies_stat
  when: thunderbird_extensions_enabled | bool

- name: Read existing Thunderbird policies file
  ansible.builtin.slurp:
    path: "{{ thunderbird_policies_file }}"
  register: thunderbird_existing_policies_slurp
  when:
    - thunderbird_extensions_enabled | bool
    - thunderbird_policies_stat.stat.exists

- name: Parse existing Thunderbird policies
  ansible.builtin.set_fact:
    thunderbird_existing_policies: "{{ (thunderbird_existing_policies_slurp.content | b64decode | from_json) if thunderbird_policies_stat.stat.exists else {'policies': {}} }}"
  when: thunderbird_extensions_enabled | bool

- name: Initialize Thunderbird extension settings policy
  ansible.builtin.set_fact:
    thunderbird_extension_settings: {}
  when: thunderbird_extensions_enabled | bool

- name: Build Thunderbird extension settings policy
  ansible.builtin.set_fact:
    thunderbird_extension_settings: "{{ thunderbird_extension_settings | default({}) | combine({ item.id: {'installation_mode': 'normal_installed', 'install_url': item.install_url} }, recursive=True) }}"
  loop: "{{ thunderbird_extensions }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - thunderbird_extensions_enabled | bool
    - item.id is defined
    - item.id | length > 0
    - item.install_url is defined
    - item.install_url | length > 0

- name: Merge Thunderbird extension settings into policies
  ansible.builtin.set_fact:
    thunderbird_policies_document: >-
      {{ thunderbird_existing_policies | combine({
        'policies': (thunderbird_existing_policies.policies | default({})) | combine({
          'ExtensionSettings': (thunderbird_existing_policies.policies.ExtensionSettings | default({})) | combine(thunderbird_extension_settings | default({}), recursive=True)
        }, recursive=True)
      }, recursive=True) }}
  when: thunderbird_extensions_enabled | bool

- name: Write Thunderbird enterprise policies
  ansible.builtin.template:
    src: policies.json.j2
    dest: "{{ thunderbird_policies_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Report Thunderbird policy change
  when: thunderbird_extensions_enabled | bool
