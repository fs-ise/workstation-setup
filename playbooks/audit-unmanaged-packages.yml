---
- name: Audit User-reason but unmanaged Fedora packages
  hosts: local
  gather_facts: false
  vars:
    package_audit_dnf_query_cmd: "dnf5 repoquery --userinstalled --queryformat '%{name}\t%{reason}\n'"
    package_audit_fallback_cmd: "dnf repoquery --userinstalled --queryformat '%{name}\n'"
    package_audit_roles_path: "{{ playbook_dir }}/../roles"
  pre_tasks:
    - name: Derive the managed DNF package set from role defaults
      ansible.builtin.include_tasks: tasks/derive-managed-dnf-packages.yml
  tasks:
    - name: Collect packages and DNF5 install reasons (preferred)
      become: true
      ansible.builtin.command: "{{ package_audit_dnf_query_cmd }}"
      register: package_audit_userinstalled_primary
      changed_when: false
      failed_when: false

    - name: Collect user-installed packages without reasons (fallback)
      become: true
      ansible.builtin.command: "{{ package_audit_fallback_cmd }}"
      register: package_audit_userinstalled_fallback
      changed_when: false
      when: package_audit_userinstalled_primary.rc != 0

    - name: Classify packages using DNF5 install reasons
      ansible.builtin.include_tasks: tasks/classify-dnf-package-reasons.yml
      vars:
        package_audit_query_lines: >-
          {{
            package_audit_userinstalled_primary.stdout_lines
            if package_audit_userinstalled_primary.rc == 0
            else package_audit_userinstalled_fallback.stdout_lines
          }}
        package_audit_query_has_reasons: "{{ package_audit_userinstalled_primary.rc == 0 }}"

    - name: Build normalized package lists for audit
      ansible.builtin.set_fact:
        package_audit_managed_flat: "{{ package_audit_managed_packages }}"
        package_audit_allowlist_flat: >-
          {{ (package_audit_allowlist + (package_audit_extra_allowlist | default([])))
             | flatten | map('string') | map('trim') | reject('equalto', '') | unique | sort }}
        package_audit_allowlist_patterns_flat: >-
          {{ (package_audit_allowlist_patterns + (package_audit_extra_allowlist_patterns | default([])))
             | flatten | map('string') | map('trim') | reject('equalto', '') | unique | sort }}

    - name: Compute unmanaged candidates after exact matching
      ansible.builtin.set_fact:
        package_audit_candidates: >-
          {{
            package_audit_detected_user
            | difference(package_audit_managed_flat + package_audit_allowlist_flat)
            | unique
            | sort
          }}

    - name: Build pattern-ignored package list
      ansible.builtin.set_fact:
        package_audit_pattern_ignored: "{{ (package_audit_pattern_ignored | default([])) + (package_audit_candidates | select('match', item) | list) }}"
      loop: "{{ package_audit_allowlist_patterns_flat }}"

    - name: Compute final unmanaged package list
      ansible.builtin.set_fact:
        package_audit_pattern_ignored: "{{ package_audit_pattern_ignored | default([]) | unique | sort }}"
        package_audit_unmanaged: >-
          {{
            package_audit_candidates
            | difference(package_audit_pattern_ignored | default([]))
            | unique
            | sort
          }}

    - name: Show audit summary
      ansible.builtin.debug:
        msg:
          - "Detected user-reason packages: {{ package_audit_detected_user | length }}"
          - "Excluded group-reason packages: {{ package_audit_detected_group | length }}"
          - "Excluded dependency-reason packages: {{ package_audit_detected_dependency | length }}"
          - "External/uncertain-reason warnings: {{ package_audit_detected_external_uncertain | length }}"
          - "Managed packages (exact): {{ package_audit_managed_flat | length }}"
          - "Exact allowlisted packages: {{ package_audit_allowlist_flat | length }}"
          - "Pattern-ignored packages: {{ package_audit_pattern_ignored | length }}"
          - "Unmanaged packages remaining: {{ package_audit_unmanaged | length }}"

    - name: Print unmanaged packages (if any)
      ansible.builtin.debug:
        msg: "{{ package_audit_unmanaged | to_nice_yaml(indent=2) }}"
      when: package_audit_unmanaged | length > 0

    - name: Warn about external or uncertain package reasons
      ansible.builtin.debug:
        msg: >-
          WARNING: Packages with external or uncertain DNF reasons are not failure candidates;
          review these name/reason records: {{ package_audit_external_uncertain_records | to_nice_yaml(indent=2) }}
      when: package_audit_external_uncertain_records | length > 0

    - name: Audit unmanaged filesystem installations
      ansible.builtin.include_tasks: tasks/audit-manual-installations.yml

    - name: Fail when unmanaged DNF packages are found
      ansible.builtin.fail:
        msg: |-
          Found unmanaged User-reason packages:
          {{ package_audit_unmanaged | to_nice_yaml(indent=2) | trim | indent(2, true) }}

          These packages are not managed by the shared workstation configuration. If this workstation
          uses an overlay, first check whether it manages them and run the combined audit from that layer.
          Add only lab-baseline packages to shared roles. Do not add personal packages to the shared
          allowlist merely to silence this audit.
      when:
        - package_audit_fail_on_unmanaged | bool
        - package_audit_unmanaged | length > 0
