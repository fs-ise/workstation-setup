---
- name: Lab stack on Fedora
  hosts: local
  become: true
  gather_facts: true

  vars:
    target_user: >-
      {{ ansible_facts["env"].get('SUDO_USER', ansible_facts["user_id"]) }}
    target_home: >-
      {{ ansible_facts["env"].get('HOME', lookup('ansible.builtin.env', 'HOME'))
         if ansible_facts["env"].get('SUDO_USER') is none
         else '/home/' ~ target_user }}

  roles:
    # Fail before any installation or configuration role runs.
    - role: preflight
      tags: [always, preflight]

    - role: baseline  # should include packages (except for those needed in the following roles)
      tags: [baseline]

    - role: desktop_apps
      tags: [desktop_apps, desktop]

    - role: git_tools
      tags: [git, git_tools]

    - role: borg_vorta
      tags: [borg_vorta, backup, borg, vorta]

    - role: veracrypt
      tags: [veracrypt]

    - role: nemo
      tags: [nemo, file_manager]

    - role: ocrmypdf
      tags: [ocr]

    - role: virtualbox
      tags: [virtualbox]

    - role: docker
      tags: [docker]

    # Image-only roles are opt-in; their Docker dependency installs the engine first.
    - role: ocr_containers
      tags: [never, ocr_containers]

    - role: development_containers
      tags: [never, development_containers]

    - role: grobid
      tags: [grobid]

    - role: languagetool
      tags: [languagetool]

    - role: quarto
      # The latex tag includes Quarto because the default LaTeX mode uses its CLI.
      tags: [quarto, latex]

    - role: latex
      tags: [latex]

    - role: r
      tags: [r, rstudio]

    - role: rstudio
      tags: [rstudio]

    - role: keepassxc
      tags: [keepassxc]

    - role: chrome
      tags: [chrome]

    - role: vscode
      tags: [vscode]

    - role: teams_for_linux
      tags: [teams]

    - role: onlyoffice
      tags: [onlyoffice]

    - role: okular
      tags: [okular]

    - role: thunderbird
      tags: [thunderbird, thunderbird_mcp]

    - role: thunderbird_mcp
      tags: [thunderbird_mcp]

    - role: dropbox
      tags: [dropbox]

    - role: obsidian
      tags: [obsidian]

    - role: desktop_gnome
      tags: [desktop, desktop_gnome]

    # Keep this last: associations are valid only after applications export their desktop entries.
    - role: default_applications
      tags: [default_applications]
