---
- name: Lab stack on Fedora
  hosts: local
  become: true
  gather_facts: true

  vars:
    target_user: >-
      {{ ansible_facts["env"].get('SUDO_USER', ansible_facts["user_id"]) }}
    target_home: >-
      {{ ansible_facts["env"].get('HOME', lookup('ansible.builtin.env', 'HOME'))
         if ansible_facts["env"].get('SUDO_USER') is none
         else '/home/' ~ target_user }}

  roles:
    - role: baseline  # should include packages (except for those needed in the following roles)
      tags: [baseline]

    - role: keyboard_copilot_rightctrl
      tags: [keyboard, copilot_key]

    - role: ocrmypdf
      tags: [ocr]

    - role: virtualbox
      tags: [virtualbox]

    - role: docker
      tags: [docker]

    - role: grobid
      tags: [grobid]

    - role: languagetool
      tags: [languagetool]

    - role: quarto
      tags: [quarto]

    - role: rstudio
      tags: [rstudio]

    - role: keepassxc
      tags: [keepassxc]

    - role: chrome
      tags: [chrome]

    - role: vscode
      tags: [vscode]

    - role: teams_for_linux
      tags: [teams]

    - role: thunderbird
      tags: [thunderbird]

    - role: desktop_gnome
      tags: [desktop]

    # Keep this last: associations are valid only after applications export their desktop entries.
    - role: default_applications
      tags: [default_applications]
