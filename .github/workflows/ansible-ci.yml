---
name: Ansible CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            .ci-pip-cache-version
      - name: Install CI dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip --version
          python -m pip debug --verbose
          python -m pip install \
            --only-binary=ruamel.yaml.clib \
            -r requirements.txt
          python -m pip show pip
          python -m pip show ansible-lint
          python -m pip show ruamel.yaml
          python -m pip show ruamel.yaml.clib
          python -m pip check
      - name: Lint YAML
        run: yamllint .

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            .ci-pip-cache-version
      - name: Install CI dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip --version
          python -m pip debug --verbose
          python -m pip install \
            --only-binary=ruamel.yaml.clib \
            -r requirements.txt
          python -m pip show pip
          python -m pip show ansible-lint
          python -m pip show ruamel.yaml
          python -m pip show ruamel.yaml.clib
          python -m pip check
      - name: Install Galaxy dependencies
        run: ansible-galaxy collection install -r requirements.yml
      - name: Lint Ansible
        run: ansible-lint

  syntax-validation:
    name: Syntax and import validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            .ci-pip-cache-version
      - name: Install CI dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip --version
          python -m pip debug --verbose
          python -m pip install \
            --only-binary=ruamel.yaml.clib \
            -r requirements.txt
          python -m pip show pip
          python -m pip show ansible-lint
          python -m pip show ruamel.yaml
          python -m pip show ruamel.yaml.clib
          python -m pip check
      - name: Cache Ansible Galaxy collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install Galaxy dependencies
        run: ansible-galaxy collection install -r requirements.yml
      - name: Validate the main playbook and role imports
        run: |
          python -m unittest tests/test_rstudio_role.py

          ansible-playbook \
            --syntax-check \
            -i tests/inventory/hosts.yml \
            playbooks/lab-stack.yml

          ansible-playbook \
            --list-tasks \
            -i tests/inventory/hosts.yml \
            playbooks/lab-stack.yml

          ansible-playbook \
            --syntax-check \
            -i tests/inventory/hosts.yml \
            tests/playbooks/veracrypt.yml

          ansible-playbook \
            -i tests/inventory/hosts.yml \
            tests/playbooks/veracrypt.yml

  container-idempotence:
    name: Fedora container idempotence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run the container-safe playbook twice
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            fedora:43 \
            bash -lc 'dnf install -y ansible-core git python3-libdnf5 && ansible-galaxy collection install -r requirements.yml && tests/run-idempotence.sh'
