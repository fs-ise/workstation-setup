---
# Fedora/DNF package drift audit settings.
# Filesystem/manual installation audit settings. Exact entries may be normalized
# names (for example, "quarto") or full paths.
manual_install_audit_allowlist: []
manual_install_audit_allowlist_patterns: []
manual_install_audit_fail_on_unmanaged: false
manual_install_audit_recommendations:
  quarto: "Install the official Quarto RPM through the quarto role."

# Prefer exact package names. Generic Fedora/base-system exceptions are listed first;
# intentional workstation additions are kept in their own section below.
package_audit_allowlist:
  # Exact exceptions reported with the User install reason.
  - NetworkManager
  - NetworkManager-wifi
  - PackageKit-command-not-found
  - bash-completion
  - fedora-workstation-repositories
  - firewall-config
  - flatpak
  - fzf
  - git-core
  - glibc-langpack-en
  - gnome-shell-extension-appindicator
