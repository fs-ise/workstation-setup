---
- name: Exercise the container-safe baseline configuration
  hosts: local
  become: true
  gather_facts: true
  vars:
    target_user: root
    target_home: /root
    baseline_base_packages: []
    baseline_remove_packages_best_effort: []
    baseline_install_packages_best_effort: []
    baseline_install_texlive_scheme: false
    baseline_install_veracrypt: false
    baseline_configure_flathub: false
  roles:
    - role: baseline

  post_tasks:
    - name: Read configured default Git branch  # noqa command-instead-of-module
      become: false
      ansible.builtin.command: git config --global init.defaultBranch
      register: ci_git_default_branch
      changed_when: false

    - name: Verify the baseline role configured Git
      ansible.builtin.assert:
        that:
          - ci_git_default_branch.stdout == "main"
        fail_msg: The baseline role did not configure Git as expected.
