---
- name: Verify role-derived managed DNF packages
  hosts: local
  gather_facts: false
  vars:
    package_audit_roles_path: "{{ playbook_dir }}/../../roles"
    package_audit_extra_roles_paths:
      - "{{ playbook_dir }}/../fixtures/package-audit-overlay/roles"
    package_audit_extra_managed_dnf_packages:
      - explicit-overlay-package
      - git
    package_audit_allowlist:
      - shared-exception
    package_audit_allowlist_patterns:
      - '^shared-family$'
    package_audit_extra_allowlist:
      - overlay-exception
    package_audit_extra_allowlist_patterns:
      - '^overlay-family-[0-9]+$'
  tasks:
    - name: Run the production managed-package derivation
      ansible.builtin.include_tasks: ../../playbooks/tasks/derive-managed-dnf-packages.yml

    - name: Verify representative role packages were discovered
      ansible.builtin.assert:
        that:
          - package_audit_role_default_files | length > 0
          - "'git' in package_audit_managed_packages"
          - "'quarto' in package_audit_managed_packages"
          - "'docker-ce' in package_audit_managed_packages"
          - "'R' in package_audit_managed_packages"
          - "'rstudio' in package_audit_managed_packages"
          - "'okular' in package_audit_managed_packages"
          - "'overlay-tool' in package_audit_managed_packages"
          - "'explicit-overlay-package' in package_audit_managed_packages"
          - "package_audit_managed_packages | select('equalto', 'git') | list | length == 1"
          - "package_audit_managed_packages == (package_audit_managed_packages | unique | sort)"

    - name: Compute a representative unmanaged-package result
      ansible.builtin.set_fact:
        package_audit_test_unmanaged: >-
          {{
            ['git', 'quarto', 'docker-ce', 'R', 'rstudio', 'okular',
             'manual-lab-package']
            | difference(package_audit_managed_packages)
            | sort
          }}

    - name: Verify only the genuinely unmanaged package remains
      ansible.builtin.assert:
        that:
          - package_audit_test_unmanaged == ['manual-lab-package']

    - name: Verify overlay allowlist inputs are combined with shared inputs
      ansible.builtin.set_fact:
        package_audit_test_exact_allowlist: >-
          {{ (package_audit_allowlist + package_audit_extra_allowlist) | unique | sort }}
        package_audit_test_pattern_allowlist: >-
          {{ (package_audit_allowlist_patterns + package_audit_extra_allowlist_patterns) | unique | sort }}

    - name: Verify overlay exact and pattern exceptions
      ansible.builtin.assert:
        that:
          - "'overlay-exception' in package_audit_test_exact_allowlist"
          - "package_audit_test_pattern_allowlist | select('equalto', '^overlay-family-[0-9]+$') | list | length == 1"

    - name: Classify representative DNF5 install reasons
      ansible.builtin.include_tasks: ../../playbooks/tasks/classify-dnf-package-reasons.yml
      vars:
        package_audit_query_has_reasons: true
        package_audit_query_lines:
          - "ansible-managed{{ '\t' }}User"
          - "fedora-workstation{{ '\t' }}Group"
          - "dependency-package{{ '\t' }}Weak Dependency"
          - "third-party{{ '\t' }}External User"
          - "uncertain-package{{ '\t' }}Future Reason"

    - name: Verify reason-aware package classification
      ansible.builtin.assert:
        that:
          - package_audit_detected_user == ['ansible-managed']
          - package_audit_detected_group == ['fedora-workstation']
          - package_audit_detected_dependency == ['dependency-package']
          - package_audit_detected_external_uncertain == ['third-party', 'uncertain-package']
          - package_audit_external_uncertain_records == ['third-party\tExternal User', 'uncertain-package\tFuture Reason']

    - name: Classify legacy fallback output as user-requested
      ansible.builtin.include_tasks: ../../playbooks/tasks/classify-dnf-package-reasons.yml
      vars:
        package_audit_query_has_reasons: false
        package_audit_query_lines:
          - legacy-user-package

    - name: Verify fallback behavior is preserved
      ansible.builtin.assert:
        that:
          - package_audit_detected_user == ['legacy-user-package']
          - package_audit_detected_group == []
          - package_audit_detected_dependency == []
          - package_audit_detected_external_uncertain == []
          - package_audit_external_uncertain_records == []
