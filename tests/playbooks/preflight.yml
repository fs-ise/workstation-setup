---
- name: Exercise supported-platform preflight decisions
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    platform_cases:
      - name: Fedora 44 x86_64
        distribution: Fedora
        version: "44"
        architecture: x86_64
        supported: true
      - name: Another Fedora major version
        distribution: Fedora
        version: "43"
        architecture: x86_64
        supported: false
      - name: Non-Fedora distribution
        distribution: Ubuntu
        version: "44"
        architecture: x86_64
        supported: false
      - name: Non-x86_64 architecture
        distribution: Fedora
        version: "44"
        architecture: aarch64
        supported: false

  tasks:
    - name: Check each platform case
      ansible.builtin.include_tasks: preflight-case.yml
      loop: "{{ platform_cases }}"
      loop_control:
        loop_var: platform_case
        label: "{{ platform_case.name }}"
