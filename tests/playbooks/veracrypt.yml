---
- name: Test VeraCrypt role selection and safety defaults
  hosts: local
  gather_facts: false
  vars:
    ansible_facts:
      distribution: Fedora
      distribution_major_version: "44"
      architecture: x86_64
  tasks:
    - name: Read the VeraCrypt role tasks
      ansible.builtin.set_fact:
        veracrypt_tasks: >-
          {{ lookup('ansible.builtin.file',
                    playbook_dir ~ '/../../roles/veracrypt/tasks/main.yml') }}

    - name: Load VeraCrypt role defaults
      ansible.builtin.include_vars:
        file: ../../roles/veracrypt/defaults/main.yml

    - name: Check pinned VeraCrypt security defaults
      ansible.builtin.assert:
        that:
          - veracrypt_version == "1.26.24"
          - veracrypt_rpm_fedora_version == "40"
          - veracrypt_tested_fedora_versions == ["42", "43", "44"]
          - >-
            veracrypt_rpm_filename ==
            'veracrypt-1.26.24-Fedora-40-x86_64.rpm'
          - "'Fedora-44' not in veracrypt_rpm_filename"
          - >-
            veracrypt_package_url ==
            'https://launchpad.net/veracrypt/trunk/1.26.24/+download/'
            ~ 'veracrypt-1.26.24-Fedora-40-x86_64.rpm'
          - veracrypt_signature_url == veracrypt_package_url ~ '.sig'
          - >-
            veracrypt_signing_key_fingerprint ==
            '5069A233D55A0EEB174A5FC3821ACD02680D16DE'
          - >-
            'allow_downgrade' not in veracrypt_tasks
          - >-
            'veracrypt_signing_key_fingerprint' in veracrypt_tasks
          - >-
            'gpgv' in veracrypt_tasks
          - >-
            '--keyring' in veracrypt_tasks
          - >-
            'ansible.builtin.rpm_key' in veracrypt_tasks

    - name: Accept Fedora 44 for VeraCrypt
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/platform.yml

    - name: Reject unsupported VeraCrypt platforms
      ansible.builtin.include_tasks: ../tasks/unsupported-platform.yml
      loop:
        - distribution: Ubuntu
          distribution_major_version: "44"
          architecture: x86_64
        - distribution: Fedora
          distribution_major_version: "41"
          architecture: x86_64
        - distribution: Fedora
          distribution_major_version: "44"
          architecture: aarch64
      loop_control:
        loop_var: unsupported_facts

    - name: Test equal installed VeraCrypt version
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/decision.yml
      vars:
        veracrypt_installed:
          rc: 0
        veracrypt_version_comparison:
          rc: 0

    - name: Check that an equal version is satisfactory
      ansible.builtin.assert:
        that:
          - not veracrypt_install_required

    - name: Test newer installed VeraCrypt version
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/decision.yml
      vars:
        veracrypt_installed:
          rc: 0
        veracrypt_version_comparison:
          rc: 0

    - name: Check that a newer version is satisfactory
      ansible.builtin.assert:
        that:
          - not veracrypt_install_required

    - name: Test older installed VeraCrypt version
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/decision.yml
      vars:
        veracrypt_installed:
          rc: 0
        veracrypt_version_comparison:
          rc: 1

    - name: Check that an older version requires an upgrade
      ansible.builtin.assert:
        that:
          - veracrypt_install_required

    - name: Test absent VeraCrypt installation
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/decision.yml
      vars:
        veracrypt_installed:
          rc: 1
        veracrypt_version_comparison:
          rc: 1

    - name: Check that an absent version requires installation
      ansible.builtin.assert:
        that:
          - veracrypt_install_required

    - name: Repeat the satisfied installation decision
      ansible.builtin.include_tasks: ../../roles/veracrypt/tasks/decision.yml
      vars:
        veracrypt_installed:
          rc: 0
        veracrypt_version_comparison:
          rc: 0

    - name: Check that the repeated decision remains unchanged
      ansible.builtin.assert:
        that:
          - not veracrypt_install_required
