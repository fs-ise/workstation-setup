---
- name: "Calculate activation: {{ keyboard_activation_scenario.name }}"
  ansible.builtin.include_role:
    name: keyboard_copilot_rightctrl
    tasks_from: activation
  vars:
    keyboard_copilot_rightctrl_mode: "{{ keyboard_activation_scenario.mode }}"
    ansible_facts:
      system_vendor: "{{ keyboard_activation_scenario.vendor }}"
      product_name: "{{ keyboard_activation_scenario.product }}"

- name: "Assert activation: {{ keyboard_activation_scenario.name }}"
  ansible.builtin.assert:
    that:
      - >-
        keyboard_copilot_rightctrl_active | bool ==
        keyboard_activation_scenario.expected | bool
    fail_msg: >-
      {{ keyboard_activation_scenario.name }} produced active={{ keyboard_copilot_rightctrl_active }};
      expected {{ keyboard_activation_scenario.expected }}.
